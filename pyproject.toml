[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulapy-pinn"
version = "0.1.0"
description = "Physics-informed neural networks for robot forward dynamics, inverse kinematics, and trajectory optimization, built on ManipulaPy's differentiable kinematics/dynamics."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Mohamed Aboelnasr", email = "aboelnasr1997@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "ManipulaPy[pytorch]>=1.4.0",
    "numpy>=1.24",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/boelnasr/manipulapy-pinn"
"Built on" = "https://github.com/boelnasr/ManipulaPy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
